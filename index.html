<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Binafast</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,900&display=swap">
<script>
/* apply the saved theme and language before first paint */
try {
  var p = JSON.parse(localStorage.getItem("binafast-prefs") || "null") || {};
  if (p.theme === "dark" || p.theme === "light") document.documentElement.setAttribute("data-theme", p.theme);
  if (p.lang === "vi") document.documentElement.lang = "vi";
} catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sign-in, username and trip chooser screens -->
<section class="gate" id="gate">
  <div class="screen" id="g-setup" hidden>
    <h1>Binafast</h1>
    <p data-i18n="setup.msg"></p>
  </div>

  <div class="screen" id="g-loading">
    <h1>Binafast</h1>
    <p class="tag"><span class="spin"></span><span data-i18n="loading"></span></p>
  </div>

  <div class="screen" id="g-signin" hidden>
    <h1>Binafast</h1>
    <p class="tag" data-i18n="gate.tag"></p>
    <button class="btn gbtn" type="button" id="g-google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span data-i18n="signin.google"></span>
    </button>
    <p class="msg err" id="g-signin-msg" role="alert"></p>
    <p class="note" data-i18n="signin.note"></p>
  </div>

  <div class="screen" id="g-error" hidden>
    <h2 data-i18n="err.title"></h2>
    <p data-i18n="err.body"></p>
    <div class="actions"><button class="btn primary" type="button" id="g-retry" data-i18n="err.retry"></button><button class="btn quiet" type="button" data-signout data-i18n="set.signout"></button></div>
  </div>

  <form class="screen" id="g-username" hidden novalidate>
    <h2 data-i18n="username.title"></h2>
    <p data-i18n="username.body"></p>
    <label class="field"><span data-i18n="username.label"></span><input id="u-name" maxlength="20" autocomplete="nickname" autocapitalize="words"></label>
    <p class="msg err" id="u-msg" role="alert"></p>
    <button class="btn primary" type="submit" id="u-go" data-i18n="username.btn"></button>
    <button class="btn quiet" type="button" data-signout data-i18n="set.signout"></button>
  </form>

  <div class="screen" id="g-trip" hidden>
    <h2 id="g-hi"></h2>
    <button class="btn primary" type="button" id="g-new" data-i18n="g.new"></button>
    <form id="g-form" class="card">
      <label class="field"><span data-i18n="g.code"></span><input id="g-code" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
      <button class="btn" type="submit" data-i18n="g.open"></button>
      <p class="msg err" id="g-msg" role="alert"></p>
    </form>
    <button class="btn quiet" type="button" data-signout data-i18n="set.signout"></button>
  </div>
</section>

<div id="app" hidden>
<header class="top">
  <div class="wrap topbar">
    <h1>Binafast</h1>
    <div class="right">
      <button class="iconbtn" id="open-settings" type="button" data-i18n-aria="settings" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button class="btn primary" id="add" type="button">+ <span data-i18n="add"></span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="banner" hidden></div>

  <section id="v-plan" class="sec" style="gap:16px">
    <div class="hero">
      <img class="hero-cats" src="assets/hero-cats.png" alt="" hidden onload="this.hidden=false">
      <h2 class="hero-name"><img src="assets/icons/globe.png" alt="" width="34" height="34"><span id="hero-name"></span></h2>
      <p class="hero-dates" id="hero-dates"></p>
      <p class="hero-total num" id="hero-total">0</p>
      <p class="hero-conv" id="hero-conv" hidden><span data-i18n="hero.conv"></span> <b id="hero-conv-v"></b></p>
    </div>
    <div class="days" id="days" role="group"></div>
    <div id="plan-body" class="sec" style="gap:16px"></div>
  </section>

  <section id="v-items" class="sec" style="gap:12px" hidden>
    <div class="filters">
      <label class="field"><span data-i18n="f.cat"></span><select id="f-cat-filter"></select></label>
      <label class="field"><span data-i18n="f.status"></span><select id="f-status-filter"></select></label>
      <label class="field"><span data-i18n="f.day"></span><select id="f-day-filter"></select></label>
      <label class="field"><span data-i18n="f.by"></span><select id="f-by-filter"></select></label>
      <label class="field" style="grid-column:1/-1"><span data-i18n="f.sort"></span>
        <select id="f-sort">
          <option value="date" data-i18n="sort.date"></option>
          <option value="price-asc" data-i18n="sort.priceAsc"></option>
          <option value="price-desc" data-i18n="sort.priceDesc"></option>
          <option value="name" data-i18n="sort.name"></option>
        </select>
      </label>
    </div>
    <div class="head"><p class="note" id="items-count"></p><p class="note num" id="items-total"></p></div>
    <div id="items-body"></div>
  </section>

  <section id="v-costs" class="sec" style="gap:16px" hidden><div id="costs-body" class="sec" style="gap:16px"></div></section>

  <section id="v-trip" class="sec" style="gap:20px" hidden>
    <div class="sec">
      <h2 data-i18n="trip.notes"></h2>
      <textarea id="trip-notes" rows="7" data-i18n-ph="trip.notes.ph"></textarea>
      <p class="msg" id="trip-notes-msg"></p>
    </div>
    <form id="trip-form" class="sec card" style="gap:12px">
      <h2 data-i18n="trip.details"></h2>
      <label class="field"><span data-i18n="trip.name"></span><input id="t-name" maxlength="80" data-i18n-ph="trip.name.ph"></label>
      <div class="grid2">
        <label class="field"><span data-i18n="trip.start"></span><input id="t-start" type="date"></label>
        <label class="field"><span data-i18n="trip.end"></span><input id="t-end" type="date"></label>
      </div>
      <label class="field"><span data-i18n="trip.cur"></span><input id="t-cur" maxlength="3" autocapitalize="characters" data-i18n-ph="trip.cur.ph"></label>
      <div class="actions"><button class="btn primary" type="submit" id="t-save" data-i18n="trip.save"></button><p class="msg" id="t-msg"></p></div>
    </form>
    <div class="sec card">
      <h2 data-i18n="trip.people"></h2>
      <div id="people" class="sec"></div>
    </div>
    <div class="sec card">
      <h2 data-i18n="trip.share"></h2>
      <p class="note" data-i18n="trip.share.note"></p>
      <div class="share"><input id="share-link" readonly data-i18n-aria="trip.share"><button class="btn" type="button" id="share-copy" data-i18n="copy"></button></div>
    </div>
  </section>
</main>

<nav class="tabs" aria-label="Sections">
  <a href="#plan"><img src="assets/icons/map.png" alt="" width="32" height="32"><i data-i18n="tab.plan"></i></a>
  <a href="#items"><img src="assets/icons/passport.png" alt="" width="32" height="32"><i data-i18n="tab.items"></i></a>
  <a href="#costs"><img src="assets/icons/wallet.png" alt="" width="32" height="32"><i data-i18n="tab.costs"></i></a>
  <a href="#trip"><img src="assets/icons/ship.png" alt="" width="32" height="32"><i data-i18n="tab.trip"></i></a>
</nav>
<div id="toast" role="status" aria-live="polite" hidden></div>

<!-- Add / edit item -->
<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="item-form" novalidate>
    <div class="head"><h2 id="dlg-title"></h2><button class="btn quiet" type="button" id="dlg-close" data-i18n="close"></button></div>

    <div class="smart" id="smart">
      <p class="smart-title" data-i18n="smart.title"></p>
      <div class="smart-row">
        <input id="i-link" type="url" inputmode="url" autocomplete="off" data-i18n-ph="smart.ph" data-i18n-aria="f.link">
        <button class="btn" type="button" id="s-pick" data-i18n="smart.shot"></button>
      </div>
      <input id="s-file" type="file" accept="image/*" hidden>
      <div class="thumb" id="s-thumb" hidden><img id="s-img" alt=""><button class="btn" type="button" id="s-rm" data-i18n="smart.remove"></button></div>
      <div class="actions"><p class="msg" id="s-msg" role="status" aria-live="polite"></p><span class="spacer"></span><button class="btn" type="button" id="s-go" hidden data-i18n="smart.read"></button></div>
    </div>

    <div class="cats" id="i-cats" role="radiogroup" data-i18n-aria="f.cat"></div>
    <label class="field"><span data-i18n="f.name"></span><input id="i-name" maxlength="120" required></label>
    <label class="field" id="w-city"><span data-i18n="f.city"></span><input id="i-city" maxlength="80"></label>
    <div id="w-transport" class="sec" style="gap:10px" hidden>
      <label class="field"><span data-i18n="f.mode"></span><select id="i-mode"></select></label>
      <div class="grid2">
        <label class="field"><span data-i18n="f.from"></span><input id="i-from" maxlength="80"></label>
        <label class="field"><span data-i18n="f.to"></span><input id="i-to" maxlength="80"></label>
      </div>
    </div>
    <div class="grid2">
      <label class="field"><span id="l-date"></span><input id="i-date" type="date"></label>
      <label class="field" id="w-end" hidden><span data-i18n="f.checkout"></span><input id="i-end" type="date"></label>
    </div>
    <div class="grid2" id="w-time">
      <label class="field"><span data-i18n="f.start"></span><input id="i-time" type="time"></label>
      <label class="field"><span data-i18n="f.end"></span><input id="i-endtime" type="time"></label>
    </div>
    <div class="grid2">
      <label class="field"><span id="l-price"></span><input id="i-price" type="number" inputmode="decimal" min="0" step="any"></label>
      <label class="field"><span data-i18n="f.status"></span><select id="i-status"></select></label>
    </div>
    <label class="field"><span data-i18n="f.notes"></span><textarea id="i-notes" rows="3"></textarea></label>
    <p class="note" id="i-by" hidden></p>
    <p class="msg err" id="i-msg" role="alert"></p>
    <div class="actions">
      <button class="btn danger" type="button" id="i-del" hidden></button>
      <span class="spacer"></span>
      <button class="btn primary" type="submit" id="i-save" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<!-- Settings -->
<dialog id="set-dlg" aria-labelledby="set-title">
  <div class="dbody">
    <div class="head"><h2 id="set-title" data-i18n="set.title"></h2><button class="btn quiet" type="button" id="set-close" data-i18n="close"></button></div>

    <div class="set-sec">
      <h3 data-i18n="set.account"></h3>
      <div class="account"><span class="av lg" id="set-av"></span><div class="who"><b id="set-uname"></b><small id="set-email"></small></div></div>
      <div class="inline"><input id="set-name" maxlength="20" autocomplete="nickname" data-i18n-aria="set.username"><button class="btn" type="button" id="set-name-save" data-i18n="set.update"></button></div>
      <p class="msg" id="set-name-msg" role="status"></p>
    </div>

    <div class="set-sec">
      <h3 data-i18n="set.appearance"></h3>
      <div class="set-row"><span data-i18n="set.theme"></span>
        <div class="seg" role="group" data-i18n-aria="set.theme">
          <button type="button" data-pref="theme" data-val="system" data-i18n="theme.system"></button>
          <button type="button" data-pref="theme" data-val="light" data-i18n="theme.light"></button>
          <button type="button" data-pref="theme" data-val="dark" data-i18n="theme.dark"></button>
        </div>
      </div>
      <div class="set-row"><span data-i18n="set.lang"></span>
        <div class="seg" role="group" data-i18n-aria="set.lang">
          <button type="button" data-pref="lang" data-val="en">English</button>
          <button type="button" data-pref="lang" data-val="vi">Tiếng Việt</button>
        </div>
      </div>
    </div>

    <div class="set-sec">
      <h3 data-i18n="set.cal"></h3>
      <div class="set-row"><span data-i18n="set.time"></span>
        <div class="seg" role="group" data-i18n-aria="set.time">
          <button type="button" data-pref="time" data-val="24" data-i18n="time.24"></button>
          <button type="button" data-pref="time" data-val="12" data-i18n="time.12"></button>
        </div>
      </div>
      <div class="set-row"><span data-i18n="set.hours"></span>
        <div class="actions" style="flex-wrap:nowrap"><select id="set-start" aria-label="Start"></select><span aria-hidden="true">–</span><select id="set-end" aria-label="End"></select></div>
      </div>
      <p class="note" data-i18n="set.hours.note"></p>
    </div>

    <div class="set-sec">
      <h3 data-i18n="set.items"></h3>
      <label class="set-row"><span data-i18n="set.cancelled"></span><input class="sw" type="checkbox" id="set-cancelled"></label>
      <label class="set-row"><span data-i18n="set.auto"></span><input class="sw" type="checkbox" id="set-auto"></label>
      <p class="note" data-i18n="set.auto.note"></p>
      <label class="set-row"><span data-i18n="set.convert"></span><select id="set-convert"><option value="" data-i18n="set.convert.off"></option><option>USD</option><option>EUR</option><option>GBP</option><option>VND</option><option>INR</option><option>JPY</option><option>KRW</option><option>THB</option><option>SGD</option><option>AUD</option></select></label>
    </div>

    <div class="set-sec">
      <h3 data-i18n="set.data"></h3>
      <button class="btn" type="button" id="set-export" data-i18n="set.export"></button>
      <button class="btn" type="button" id="set-copy" data-i18n="set.copylink"></button>
      <button class="btn" type="button" id="set-switch" data-i18n="set.switch"></button>
    </div>

    <button class="btn danger" type="button" data-signout data-i18n="set.signout"></button>
  </div>
</dialog>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
